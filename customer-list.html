<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Module Quản Lý Khách - Tìm kiếm & Lọc (Đà Nẵng)</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background-color: #f4f6f8;
      color: #333;
    }
    .card {
      background: #fff;
      padding: 24px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      max-width: 1050px;
      margin: 0 auto;
    }
    h2 {
      margin-top: 0;
      color: #1e293b;
    }
    .subtitle {
      color: #64748b;
      margin-bottom: 20px;
      font-size: 14px;
    }
    
    /* Tabs chuyển đổi đối tượng */
    .tabs {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
      border-bottom: 2px solid #e2e8f0;
    }
    .tab-btn {
      padding: 10px 20px;
      border: none;
      background: none;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      color: #64748b;
      transition: 0.2s;
    }
    .tab-btn.active {
      color: #0284c7;
      border-bottom: 3px solid #0284c7;
    }

    /* Thanh điều khiển: Tìm kiếm & Lọc */
    .controls {
      display: flex;
      gap: 10px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }
    .controls input, .controls select, .controls button {
      padding: 9px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 14px;
      outline: none;
    }
    .controls input:focus, .controls select:focus {
      border-color: #0284c7;
    }
    .controls input {
      flex: 2;
      min-width: 220px;
    }
    .controls select {
      flex: 1;
      min-width: 150px;
    }
    .btn-reset {
      background-color: #64748b;
      color: white;
      cursor: pointer;
      border: none;
      font-weight: 500;
    }
    .btn-reset:hover {
      background-color: #475569;
    }

    /* Bảng danh sách */
    table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 16px;
    }
    th, td {
      padding: 12px 10px;
      text-align: left;
      border-bottom: 1px solid #e2e8f0;
      font-size: 14px;
    }
    th {
      background-color: #f8fafc;
      color: #475569;
      font-weight: 600;
    }
    tr:hover {
      background-color: #f1f5f9;
    }

    /* Badges */
    .badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: bold;
      white-space: nowrap;
    }
    .badge-success { background: #dcfce7; color: #166534; }
    .badge-warning { background: #fef9c3; color: #854d0e; }
    .badge-secondary { background: #f1f5f9; color: #475569; }
    .badge-danger { background: #fee2e2; color: #991b1b; }
    .badge-info { background: #e0f2fe; color: #0369a1; }

    /* Nút thao tác */
    .btn-action {
      padding: 5px 10px;
      font-size: 13px;
      border: 1px solid #0284c7;
      background: #fff;
      color: #0284c7;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 500;
    }
    .btn-action:hover {
      background: #0284c7;
      color: white;
    }

    /* Phân trang */
    .pagination {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 12px;
    }
    .pagination button {
      padding: 6px 14px;
      border: 1px solid #cbd5e1;
      background: #fff;
      border-radius: 5px;
      cursor: pointer;
      font-size: 13px;
    }
    .pagination button:disabled {
      background: #f1f5f9;
      color: #94a3b8;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

<div class="card">
  <h2>Quản Lý Khách - Tra Cứu & Lọc Dữ Liệu</h2>
  <div class="subtitle">Phụ trách: <b>T</b> (Tìm kiếm + Bộ lọc + Bảng dữ liệu + Phân trang)</div>

  <!-- Chuyển Tab giữa Người thuê và Chủ trọ -->
  <div class="tabs">
    <button class="tab-btn active" id="tabRenter" onclick="switchTab('renter')">Quản Lý Người Thuê</button>
    <button class="tab-btn" id="tabLandlord" onclick="switchTab('landlord')">Quản Lý Chủ Trọ</button>
  </div>

  <!-- Thanh công cụ tìm kiếm và lọc -->
  <div class="controls">
    <input type="text" id="searchInput" placeholder="Tìm kiếm theo Tên, SĐT, Email hoặc Địa chỉ...">
    <select id="statusFilter"></select>
    <select id="extraFilter"></select>
    <button class="btn-reset" onclick="resetFilters()">Đặt lại</button>
  </div>

  <!-- Bảng dữ liệu -->
  <table>
    <thead id="tableHeader"></thead>
    <tbody id="tableBody"></tbody>
  </table>

  <!-- Phân trang -->
  <div class="pagination">
    <span id="recordCount" style="color: #64748b; font-size: 13px;">Đang tải...</span>
    <div>
      <button id="prevBtn" onclick="prevPage()">Trang trước</button>
      <span id="pageInfo" style="margin: 0 12px; font-weight: bold; font-size: 13px;"></span>
      <button id="nextBtn" onclick="nextPage()">Trang sau</button>
    </div>
  </div>
</div>

<!-- GỌI FILE mockData.js (CÙNG THƯ MỤC) -->
<script src="mockData.js"></script>

<script>
  let currentTab = 'renter';
  let currentPage = 1;
  const pageSize = 3;

  const searchInput = document.getElementById("searchInput");
  const statusFilter = document.getElementById("statusFilter");
  const extraFilter = document.getElementById("extraFilter");
  const tableHeader = document.getElementById("tableHeader");
  const tableBody = document.getElementById("tableBody");
  const pageInfo = document.getElementById("pageInfo");
  const recordCount = document.getElementById("recordCount");
  const prevBtn = document.getElementById("prevBtn");
  const nextBtn = document.getElementById("nextBtn");

  function setupFilters() {
    if (currentTab === 'renter') {
      statusFilter.innerHTML = `
        <option value="all">-- Tất cả trạng thái --</option>
        <option value="looking">Đang tìm phòng</option>
        <option value="renting">Đang thuê</option>
        <option value="checked_out">Đã trả phòng</option>
      `;
      extraFilter.innerHTML = `
        <option value="all">-- Xác thực hồ sơ --</option>
        <option value="true">Đã xác thực</option>
        <option value="false">Chưa xác thực</option>
      `;
    } else {
      statusFilter.innerHTML = `
        <option value="all">-- Trạng thái hoạt động --</option>
        <option value="active">Đang hoạt động</option>
        <option value="paused">Tạm ngưng</option>
        <option value="rented">Đã cho thuê</option>
      `;
      extraFilter.innerHTML = `
        <option value="all">-- Phân loại chủ trọ --</option>
        <option value="type1">Loại 1: Tiêu chuẩn người thuê</option>
        <option value="type2">Loại 2: Khả năng thanh toán</option>
      `;
    }
  }

  function render() {
    const rawData = currentTab === 'renter' ? mockRenters : mockLandlords;
    const keyword = searchInput.value.toLowerCase().trim();
    const statusVal = statusFilter.value;
    const extraVal = extraFilter.value;

    const filtered = rawData.filter(item => {
      // Tìm theo Tên, SĐT, Email, Phòng hoặc Địa chỉ
      const searchTarget = (
        (item.name || "") + " " +
        (item.phone || "") + " " +
        (item.email || "") + " " +
        (item.room || "") + " " +
        (item.address || "")
      ).toLowerCase();

      const matchSearch = searchTarget.includes(keyword);
      const matchStatus = (statusVal === 'all') || (item.status === statusVal);
      
      let matchExtra = true;
      if (extraVal !== 'all') {
        if (currentTab === 'renter') {
          matchExtra = String(item.verified) === extraVal;
        } else {
          matchExtra = item.type === extraVal;
        }
      }
      return matchSearch && matchStatus && matchExtra;
    });

    const totalPages = Math.ceil(filtered.length / pageSize) || 1;
    if (currentPage > totalPages) currentPage = totalPages;
    const startIndex = (currentPage - 1) * pageSize;
    const currentList = filtered.slice(startIndex, startIndex + pageSize);

    // Tiêu đề cột
    if (currentTab === 'renter') {
      tableHeader.innerHTML = `
        <tr>
          <th>Mã</th>
          <th>Người thuê</th>
          <th>Liên hệ</th>
          <th>Phòng hiện tại</th>
          <th>Trạng thái</th>
          <th>Xác thực</th>
          <th>Thao tác</th>
        </tr>`;
    } else {
      tableHeader.innerHTML = `
        <tr>
          <th>Mã</th>
          <th>Tên chủ trọ</th>
          <th>Liên hệ</th>
          <th>Địa chỉ khu trọ</th>
          <th>Trạng thái</th>
          <th>Phân loại</th>
          <th>Thao tác</th>
        </tr>`;
    }

    // Nội dung dòng
    if (currentList.length === 0) {
      tableBody.innerHTML = `<tr><td colspan="7" style="text-align:center; color:#94a3b8; padding: 24px;">Không tìm thấy kết quả phù hợp</td></tr>`;
    } else {
      tableBody.innerHTML = currentList.map(item => {
        if (currentTab === 'renter') {
          return `
            <tr>
              <td><b>${item.id}</b></td>
              <td><b>${item.name}</b><br><small style="color:#64748b;">Gia nhập: ${item.joinedDate}</small></td>
              <td>${item.phone}<br><small style="color:#64748b;">${item.email}</small></td>
              <td>${item.room}</td>
              <td>${getRenterStatusBadge(item.status)}</td>
              <td>${item.verified ? '<span class="badge badge-success">Đã duyệt</span>' : '<span class="badge badge-secondary">Chưa</span>'}</td>
              <td><button class="btn-action" onclick="viewDetail('${item.id}')">Chi tiết</button></td>
            </tr>`;
        } else {
          return `
            <tr>
              <td><b>${item.id}</b></td>
              <td><b>${item.name}</b><br><small style="color:#64748b;">Tổng: ${item.totalRooms} phòng</small></td>
              <td>${item.phone}<br><small style="color:#64748b;">${item.email}</small></td>
              <td>${item.address}</td>
              <td>${getLandlordStatusBadge(item.status)}</td>
              <td>${item.type === 'type1' ? '<span class="badge badge-info">Loại 1: Tiêu chuẩn</span>' : '<span class="badge badge-secondary">Loại 2: Tài chính</span>'}</td>
              <td><button class="btn-action" onclick="viewDetail('${item.id}')">Chi tiết</button></td>
            </tr>`;
        }
      }).join('');
    }

    recordCount.innerText = `Hiển thị ${currentList.length} trên ${filtered.length} kết quả`;
    pageInfo.innerText = `${currentPage} / ${totalPages}`;
    prevBtn.disabled = currentPage === 1;
    nextBtn.disabled = currentPage === totalPages;
  }

  function getRenterStatusBadge(st) {
    if (st === 'renting') return '<span class="badge badge-success">Đang thuê</span>';
    if (st === 'looking') return '<span class="badge badge-warning">Đang tìm</span>';
    return '<span class="badge badge-secondary">Đã trả phòng</span>';
  }
  function getLandlordStatusBadge(st) {
    if (st === 'active') return '<span class="badge badge-success">Hoạt động</span>';
    if (st === 'paused') return '<span class="badge badge-danger">Tạm ngưng</span>';
    return '<span class="badge badge-secondary">Đã cho thuê</span>';
  }

  function switchTab(tab) {
    currentTab = tab;
    document.getElementById("tabRenter").className = `tab-btn ${tab === 'renter' ? 'active' : ''}`;
    document.getElementById("tabLandlord").className = `tab-btn ${tab === 'landlord' ? 'active' : ''}`;
    setupFilters();
    resetFilters();
  }

  function resetFilters() {
    searchInput.value = '';
    statusFilter.value = 'all';
    extraFilter.value = 'all';
    currentPage = 1;
    render();
  }

  function prevPage() { if (currentPage > 1) { currentPage--; render(); } }
  function nextPage() { currentPage++; render(); }

  function viewDetail(id) {
    alert("Xem chi tiết hồ sơ: " + id);
  }

  searchInput.addEventListener("input", () => { currentPage = 1; render(); });
  statusFilter.addEventListener("change", () => { currentPage = 1; render(); });
  extraFilter.addEventListener("change", () => { currentPage = 1; render(); });

  setupFilters();
  render();
</script>
</body>
</html>
